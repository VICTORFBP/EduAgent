services:
  n8n:
    image: n8nio/n8n:2.18.0
    container_name: n8n_eduagent
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Bogota
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      # - WEBHOOK_URL=http://localhost:5678/ # Opcional si se utiliza tunnel externo como Ngrok más adelante
    volumes:
      - ./n8n_data:/home/node/.n8n
    command: start

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduagent_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: eduagent_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000 # Para que el rewrite de Next.js encuentre el backend en la red de Docker
    # env_file:
    #   - ./frontend/.env.local
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
      - n8n
